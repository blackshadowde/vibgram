name: Vibe Gram test build

# Step 1: prove the official Telegram Android source builds on GitHub's
# free machines. Nothing is changed in the code; the tweaks below only
# apply inside this build (arm64 phones only, our own package name).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android NDK, CMake, SDK 36
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null
          $SDKM "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Test-build tweaks
        run: |
          # arm64 phones only (4x faster than building all CPU types)
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
          # own package name, so it installs next to official Telegram
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=app.vibe.gram/' gradle.properties
          sed -i 's/"package_name": "org.telegram.messenger/"package_name": "app.vibe.gram/g' TMessagesProj*/google-services.json
          # fit the free runner's 16 GB of memory
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep -n "abiFilters" TMessagesProj_App/build.gradle | head -3

      - name: Build APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon

      - name: Disk left
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-gram-test
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          
